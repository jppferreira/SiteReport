<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trade Report iOS header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1320px;
        height: 2868px;
        overflow: hidden;
        background: #f4fbf6;
      }
      canvas {
        display: block;
        width: 1320px;
        height: 2868px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="poster" width="1320" height="2868"></canvas>
    <script type="module">
      import * as THREE from 'three';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const POSTER_W = 1320;
      const POSTER_H = 2868;
      const shot = new URLSearchParams(location.search).get('shot') || 'jobs';

      const COPY = {
        jobs: {
          kicker: 'For trades',
          title: ['Proof of work', 'in minutes.'],
          accentLine: 1,
          lede: 'Photograph the job, note what you did, and share a branded PDF before you leave.',
        },
        photos: {
          kicker: 'On site',
          title: ['Before and after,', 'kept with the job.'],
          accentLine: 0,
          lede: 'Split the work into rooms. Each section keeps its own before and after photos.',
        },
        report: {
          kicker: 'The handover',
          title: ['A branded PDF', 'before you leave.'],
          accentLine: 1,
          lede: 'Preview the report on the phone, then share it with the client.',
        },
      };

      const ink = '#121412';
      const muted = '#5E6862';
      const faint = '#8E9791';
      const line = '#E6E8E6';
      const paper = '#FFFFFF';
      const wash = '#F6FAF7';
      const sunken = '#F2F4F2';
      const accent = '#1FA84A';
      const dark = '#101310';

      const images = await Promise.all([
        loadImage('/website/images/mark.png'),
        loadImage('/assets/images/kitchen-before.jpg'),
        loadImage('/assets/images/report-cover.jpg'),
        loadImage('/website/images/carpenter-on-site.jpg'),
        loadImage('/assets/images/report-thanks.jpg'),
      ]);
      const [mark, kitchen, cover, carpenter, thanks] = images;

      await document.fonts.load('600 92px Lexend');
      await document.fonts.load('400 32px Lexend');
      await document.fonts.load('600 17px Lexend');

      const screen = drawScreen(shot, { mark, kitchen, cover, carpenter, thanks });
      const phone = await renderPhone(screen);
      paintPoster(COPY[shot] || COPY.jobs, phone);
      document.body.dataset.ready = 'true';

      function paintPoster(copy, phoneCanvas) {
        const canvas = document.getElementById('poster');
        const ctx = canvas.getContext('2d');
        const washGradient = ctx.createLinearGradient(0, 0, 0, POSTER_H);
        washGradient.addColorStop(0, '#E7F8EE');
        washGradient.addColorStop(0.42, '#F7FCF8');
        washGradient.addColorStop(1, '#E4F3EA');
        ctx.fillStyle = washGradient;
        ctx.fillRect(0, 0, POSTER_W, POSTER_H);

        const glow = ctx.createRadialGradient(660, 1680, 80, 660, 1760, 920);
        glow.addColorStop(0, 'rgba(31, 168, 74, 0.16)');
        glow.addColorStop(1, 'rgba(31, 168, 74, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, POSTER_W, POSTER_H);

        ctx.textAlign = 'center';
        ctx.fillStyle = accent;
        ctx.font = '600 28px Lexend, sans-serif';
        ctx.letterSpacing = '4px';
        ctx.fillText(copy.kicker.toUpperCase(), POSTER_W / 2, 250);
        ctx.letterSpacing = '0px';

        ctx.font = '600 92px Lexend, sans-serif';
        ctx.textBaseline = 'top';
        const lineHeight = 104;
        copy.title.forEach((line, index) => {
          ctx.fillStyle = index === copy.accentLine ? accent : ink;
          ctx.fillText(line, POSTER_W / 2, 310 + index * lineHeight);
        });

        ctx.fillStyle = muted;
        ctx.font = '400 34px Lexend, sans-serif';
        wrapText(ctx, copy.lede, POSTER_W / 2, 560, 980, 48);

        const trimmed = trimAlpha(phoneCanvas, 36);
        const maxH = POSTER_H - 820;
        let phoneW = 1180;
        let phoneH = phoneW * (trimmed.height / trimmed.width);
        if (phoneH > maxH) {
          phoneH = maxH;
          phoneW = phoneH * (trimmed.width / trimmed.height);
        }
        const x = (POSTER_W - phoneW) / 2;
        const y = 780;
        ctx.drawImage(trimmed, x, y, phoneW, phoneH);
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let cursor = y;
        words.forEach((word, index) => {
          const next = line ? `${line} ${word}` : word;
          if (ctx.measureText(next).width > maxWidth && line) {
            ctx.fillText(line, x, cursor);
            line = word;
            cursor += lineHeight;
          } else {
            line = next;
          }
          if (index === words.length - 1) ctx.fillText(line, x, cursor);
        });
      }

      async function renderPhone(screenCanvas) {
        const width = 1200;
        const height = 2200;
        const renderer = new THREE.WebGLRenderer({
          alpha: true,
          antialias: true,
          preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(2);
        renderer.setSize(width, height, false);
        renderer.setClearColor(0x000000, 0);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        const scene = new THREE.Scene();
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
        pmrem.dispose();

        const camera = new THREE.PerspectiveCamera(18, width / height, 0.1, 40);
        camera.position.set(0.72, 0.06, 7.1);
        camera.lookAt(0.02, -0.02, 0);

        const key = new THREE.DirectionalLight(0xfff6ee, 2.4);
        key.position.set(-2.6, 3.2, 2.8);
        scene.add(key);
        const rim = new THREE.DirectionalLight(0xd7e8ff, 2.8);
        rim.position.set(3.2, 1.2, -1.2);
        scene.add(rim);
        const fill = new THREE.DirectionalLight(0xffffff, 0.55);
        fill.position.set(-0.4, -0.6, 3.2);
        scene.add(fill);

        const phone = new THREE.Group();
        phone.rotation.order = 'YXZ';
        phone.rotation.set(-0.05, -0.28, 0.01);
        scene.add(phone);

        const bodyWidth = 0.86;
        const bodyHeight = 1.86;
        const bodyDepth = 0.078;
        const corner = 0.118;
        const brush = brushedRoughness();
        const metal = new THREE.MeshPhysicalMaterial({
          color: 0x2c302c,
          metalness: 1,
          roughness: 0.32,
          roughnessMap: brush,
          clearcoat: 0.45,
          clearcoatRoughness: 0.22,
          envMapIntensity: 1.55,
        });
        const body = new THREE.Mesh(extrudedPhone(bodyWidth, bodyHeight, bodyDepth, corner), metal);
        body.geometry.computeBoundingBox();
        const frontZ = body.geometry.boundingBox.max.z;
        phone.add(body);

        const bezel = new THREE.Mesh(
          roundedPlane(bodyWidth - 0.045, bodyHeight - 0.045, corner - 0.02),
          new THREE.MeshBasicMaterial({ color: 0x050605 })
        );
        bezel.position.z = frontZ + 0.004;
        phone.add(bezel);

        const map = new THREE.CanvasTexture(screenCanvas);
        map.colorSpace = THREE.SRGBColorSpace;
        map.anisotropy = 8;
        const screenGeometry = roundedPlane(bodyWidth - 0.062, bodyHeight - 0.062, corner - 0.028);
        fitUVs(screenGeometry);
        const screenMesh = new THREE.Mesh(
          screenGeometry,
          new THREE.MeshBasicMaterial({ map, transparent: true })
        );
        screenMesh.position.z = frontZ + 0.008;
        phone.add(screenMesh);

        const glass = new THREE.Mesh(
          roundedPlane(bodyWidth - 0.05, bodyHeight - 0.05, corner - 0.022),
          new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0,
            roughness: 0.04,
            transmission: 0,
            transparent: true,
            opacity: 0.1,
            clearcoat: 1,
            clearcoatRoughness: 0.04,
            envMapIntensity: 1.8,
            depthWrite: false,
          })
        );
        glass.position.z = frontZ + 0.014;
        phone.add(glass);

        const buttonMaterial = new THREE.MeshPhysicalMaterial({
          color: 0x1a1c1a,
          metalness: 1,
          roughness: 0.24,
          roughnessMap: brush,
          clearcoat: 0.7,
          envMapIntensity: 1.6,
        });
        addButton(phone, buttonMaterial, bodyWidth / 2 + 0.006, 0.18, 0, 0.2, 0.032);
        addButton(phone, buttonMaterial, -bodyWidth / 2 - 0.006, 0.42, 0, 0.11, 0.026);
        addButton(phone, buttonMaterial, -bodyWidth / 2 - 0.006, 0.22, 0, 0.16, 0.026);
        addButton(phone, buttonMaterial, -bodyWidth / 2 - 0.006, 0.02, 0, 0.16, 0.026);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(2.4, 0.9),
          new THREE.MeshBasicMaterial({ map: contactShadow(), transparent: true, depthWrite: false })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(0.18, -1.12, 0.05);
        scene.add(ground);

        renderer.render(scene, camera);
        const output = document.createElement('canvas');
        output.width = renderer.domElement.width;
        output.height = renderer.domElement.height;
        output.getContext('2d').drawImage(renderer.domElement, 0, 0);
        renderer.dispose();
        return output;
      }

      function addButton(phone, material, x, y, z, height, depth) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.012, height, depth), material);
        mesh.position.set(x, y, z);
        phone.add(mesh);
      }

      function extrudedPhone(width, height, depth, radius) {
        const geometry = new THREE.ExtrudeGeometry(roundedShape(width, height, radius), {
          depth,
          bevelEnabled: true,
          bevelThickness: 0.01,
          bevelSize: 0.008,
          bevelSegments: 4,
          curveSegments: 20,
        });
        geometry.translate(0, 0, -depth / 2);
        return geometry;
      }

      function roundedPlane(width, height, radius) {
        return new THREE.ShapeGeometry(roundedShape(width, height, radius), 20);
      }

      function fitUVs(geometry) {
        geometry.computeBoundingBox();
        const box = geometry.boundingBox;
        const spanX = box.max.x - box.min.x;
        const spanY = box.max.y - box.min.y;
        const uv = geometry.attributes.uv;
        for (let i = 0; i < uv.count; i += 1) {
          uv.setXY(i, (uv.getX(i) - box.min.x) / spanX, (uv.getY(i) - box.min.y) / spanY);
        }
        uv.needsUpdate = true;
      }

      function trimAlpha(source, padding) {
        const ctx = source.getContext('2d');
        const { width, height } = source;
        const data = ctx.getImageData(0, 0, width, height).data;
        let minX = width;
        let minY = height;
        let maxX = 0;
        let maxY = 0;
        const step = 4;
        for (let y = 0; y < height; y += step) {
          for (let x = 0; x < width; x += step) {
            if (data[(y * width + x) * 4 + 3] < 12) continue;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
          }
        }
        const x = Math.max(0, minX - padding);
        const y = Math.max(0, minY - padding);
        const w = Math.min(width - x, maxX - minX + padding * 2);
        const h = Math.min(height - y, maxY - minY + padding * 2);
        const output = document.createElement('canvas');
        output.width = w;
        output.height = h;
        output.getContext('2d').drawImage(source, x, y, w, h, 0, 0, w, h);
        return output;
      }

      function roundedShape(width, height, radius) {
        const shape = new THREE.Shape();
        const x = -width / 2;
        const y = -height / 2;
        const r = Math.min(radius, width / 2 - 0.001, height / 2 - 0.001);
        shape.moveTo(x + r, y);
        shape.lineTo(x + width - r, y);
        shape.absarc(x + width - r, y + r, r, -Math.PI / 2, 0, false);
        shape.lineTo(x + width, y + height - r);
        shape.absarc(x + width - r, y + height - r, r, 0, Math.PI / 2, false);
        shape.lineTo(x + r, y + height);
        shape.absarc(x + r, y + height - r, r, Math.PI / 2, Math.PI, false);
        shape.lineTo(x, y + r);
        shape.absarc(x + r, y + r, r, Math.PI, Math.PI * 1.5, false);
        return shape;
      }

      function contactShadow() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 220;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(256, 110, 10, 256, 110, 230);
        gradient.addColorStop(0, 'rgba(16, 28, 20, 0.38)');
        gradient.addColorStop(0.5, 'rgba(16, 28, 20, 0.12)');
        gradient.addColorStop(1, 'rgba(16, 28, 20, 0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, canvas.width, canvas.height);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function brushedRoughness() {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 256;
        const context = canvas.getContext('2d');
        context.fillStyle = '#8a8a8a';
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < canvas.height; y += 1) {
          const shade = 120 + Math.random() * 50;
          context.strokeStyle = `rgba(${shade}, ${shade}, ${shade}, 0.45)`;
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(canvas.width, y);
          context.stroke();
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1, 4);
        texture.colorSpace = THREE.NoColorSpace;
        return texture;
      }

      function drawScreen(name, photos) {
        const width = 402;
        const height = 874;
        const scale = 3;
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = height * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);
        ctx.fillStyle = wash;
        ctx.fillRect(0, 0, width, height);
        drawStatus(ctx, width);
        if (name === 'photos') drawPhotos(ctx, width, height, photos);
        else if (name === 'report') drawReport(ctx, width, height, photos);
        else drawJobs(ctx, width, height, photos);
        punchCorners(ctx, canvas.width, canvas.height, 54 * scale);
        return canvas;
      }

      function punchCorners(ctx, width, height, radius) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalCompositeOperation = 'destination-in';
        ctx.beginPath();
        roundPath(ctx, 0, 0, width, height, radius);
        ctx.fillStyle = '#000';
        ctx.fill();
      }

      function drawStatus(ctx, width) {
        ctx.fillStyle = ink;
        ctx.font = '600 17px Lexend, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('9:41', 28, 32);
        ctx.fillStyle = '#0C0E0C';
        roundPath(ctx, width / 2 - 62, 16, 124, 36, 18);
        ctx.fill();
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(width - 78, 26);
        ctx.lineTo(width - 78, 38);
        ctx.moveTo(width - 72, 23);
        ctx.lineTo(width - 72, 41);
        ctx.moveTo(width - 66, 20);
        ctx.lineTo(width - 66, 44);
        ctx.stroke();
        ctx.strokeStyle = ink;
        ctx.lineWidth = 1.5;
        roundPath(ctx, width - 52, 22, 24, 12, 3);
        ctx.stroke();
        ctx.fillStyle = ink;
        ctx.fillRect(width - 50, 24, 16, 8);
      }

      function drawJobs(ctx, width, height, photos) {
        const markSize = 36;
        ctx.drawImage(photos.mark, 22, 78, markSize, markSize);
        ctx.font = '600 28px Lexend, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        const trade = 'Trade';
        ctx.fillStyle = ink;
        ctx.fillText(trade, 68, 96);
        ctx.fillStyle = accent;
        ctx.fillText('Report', 68 + ctx.measureText(trade).width, 96);

        roundPath(ctx, 20, 136, width - 88, 48, 14);
        ctx.fillStyle = paper;
        ctx.fill();
        ctx.strokeStyle = line;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = faint;
        ctx.font = '400 16px Lexend, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText('Search jobs...', 40, 160);

        roundPath(ctx, width - 60, 136, 40, 48, 14);
        ctx.fillStyle = dark;
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(width - 40, 150);
        ctx.lineTo(width - 40, 170);
        ctx.moveTo(width - 50, 160);
        ctx.lineTo(width - 30, 160);
        ctx.stroke();

        chip(ctx, 20, 200, 'All', true);
        chip(ctx, 84, 200, 'Draft', false);
        chip(ctx, 168, 200, 'Complete', false);

        const jobs = [
          ['Kitchen refit', '14 Oak Street', '24 Oct 2026  ·  8 photos', photos.kitchen],
          ['Boiler swap', 'Riverside Cottage', '18 Oct 2026  ·  4 photos', photos.cover],
          ['Snagging visit', 'Flat 2, Harbour Mews', '9 Oct 2026  ·  6 photos', photos.carpenter],
        ];
        jobs.forEach((job, index) => {
          jobCard(ctx, 20, 258 + index * 112, width - 40, job[0], job[1], job[2], job[3]);
        });

        drawTabBar(ctx, width, height, 0);
      }

      function drawPhotos(ctx, width, height, photos) {
        navBar(ctx, width, 'Photos');
        ctx.fillStyle = muted;
        ctx.font = '400 15px Lexend, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        wrapLeft(ctx, 'Add a section for each part of the job. Before and after photos stay with that section.', 22, 132, width - 44, 22);

        roundPath(ctx, 20, 196, width - 40, 292, 16);
        ctx.fillStyle = paper;
        ctx.fill();
        ctx.strokeStyle = line;
        ctx.lineWidth = 1;
        ctx.stroke();
        areaRow(ctx, 20, 196, width - 40, 'Kitchen', '2 before · 2 after', [photos.kitchen, photos.cover, photos.thanks, photos.carpenter], true);
        areaRow(ctx, 20, 342, width - 40, 'Utility', '1 before · 1 after', [photos.carpenter, photos.kitchen], false);

        const buttonY = height - 92;
        roundPath(ctx, 20, buttonY, width - 40, 52, 14);
        ctx.fillStyle = dark;
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 17px Lexend, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Add section', width / 2, buttonY + 26);
      }

      function drawReport(ctx, width, height, photos) {
        navBar(ctx, width, 'Report preview');
        const templates = ['Trade Pack', 'Modern Clean', 'Image Led'];
        templates.forEach((label, index) => {
          const x = 20 + index * 122;
          roundPath(ctx, x, 124, 114, 64, 12);
          ctx.fillStyle = index === 0 ? '#E7F6EC' : paper;
          ctx.fill();
          ctx.strokeStyle = index === 0 ? accent : line;
          ctx.lineWidth = index === 0 ? 2 : 1;
          ctx.stroke();
          ctx.fillStyle = ink;
          ctx.font = '600 12px Lexend, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x + 57, 156);
        });

        roundPath(ctx, 20, 204, width - 40, height - 292, 16);
        ctx.fillStyle = paper;
        ctx.fill();
        ctx.save();
        roundPath(ctx, 20, 204, width - 40, height - 292, 16);
        ctx.clip();
        ctx.drawImage(photos.cover, 20, 204, width - 40, 168);
        ctx.fillStyle = 'rgba(16, 19, 16, 0.45)';
        ctx.fillRect(20, 204, width - 40, 168);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 22px Lexend, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('Kitchen refit', 36, 332);
        ctx.font = '400 13px Lexend, sans-serif';
        ctx.fillText('14 Oak Street  ·  12 Apr 2026', 36, 354);

        ctx.fillStyle = ink;
        ctx.font = '600 16px Lexend, sans-serif';
        ctx.fillText('Your business', 36, 408);
        ctx.fillStyle = muted;
        ctx.font = '400 13px Lexend, sans-serif';
        ctx.fillText('Work completed', 36, 446);
        wrapLeft(ctx, 'Replaced the units, worktop, and sink. Room left ready to use.', 36, 468, width - 88, 20);
        ctx.fillStyle = muted;
        ctx.font = '400 13px Lexend, sans-serif';
        ctx.fillText('Before', 36, 540);
        ctx.fillText('After', width / 2 + 8, 540);
        const photoW = (width - 88) / 2;
        roundPath(ctx, 36, 552, photoW, 118, 8);
        ctx.save();
        ctx.clip();
        ctx.drawImage(photos.kitchen, 36, 552, photoW, 118);
        ctx.restore();
        roundPath(ctx, 36 + photoW + 12, 552, photoW, 118, 8);
        ctx.save();
        ctx.clip();
        ctx.drawImage(photos.thanks, 36 + photoW + 12, 552, photoW, 118);
        ctx.restore();
        ctx.restore();

        roundPath(ctx, 20, height - 88, width - 40, 52, 14);
        ctx.fillStyle = accent;
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '600 17px Lexend, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Create PDF', width / 2, height - 62);
      }

      function navBar(ctx, width, title) {
        ctx.strokeStyle = ink;
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(34, 86);
        ctx.lineTo(24, 96);
        ctx.lineTo(34, 106);
        ctx.stroke();
        ctx.fillStyle = ink;
        ctx.font = '600 18px Lexend, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(title, width / 2, 96);
      }

      function areaRow(ctx, x, y, width, title, subtitle, thumbs, divider) {
        ctx.fillStyle = ink;
        ctx.font = '500 17px Lexend, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(title, x + 16, y + 16);
        ctx.fillStyle = muted;
        ctx.font = '400 13px Lexend, sans-serif';
        ctx.fillText(subtitle, x + 16, y + 40);
        thumbs.forEach((image, index) => {
          const size = 52;
          const tx = x + 16 + index * (size + 8);
          const ty = y + 70;
          ctx.save();
          roundPath(ctx, tx, ty, size, size, 8);
          ctx.clip();
          ctx.drawImage(image, tx, ty, size, size);
          ctx.restore();
        });
        ctx.strokeStyle = faint;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + width - 28, y + 58);
        ctx.lineTo(x + width - 20, y + 66);
        ctx.lineTo(x + width - 28, y + 74);
        ctx.stroke();
        if (divider) {
          ctx.strokeStyle = line;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 16, y + 146);
          ctx.lineTo(x + width - 16, y + 146);
          ctx.stroke();
        }
      }

      function jobCard(ctx, x, y, width, title, subtitle, meta, image) {
        ctx.save();
        ctx.shadowColor = 'rgba(16, 19, 16, 0.06)';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 6;
        roundPath(ctx, x, y, width, 100, 16);
        ctx.fillStyle = paper;
        ctx.fill();
        ctx.restore();
        ctx.save();
        roundPath(ctx, x + 12, y + 14, 72, 72, 12);
        ctx.clip();
        ctx.drawImage(image, x + 12, y + 14, 72, 72);
        ctx.restore();
        ctx.fillStyle = ink;
        ctx.font = '600 17px Lexend, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(title, x + 98, y + 22);
        ctx.fillStyle = muted;
        ctx.font = '400 14px Lexend, sans-serif';
        ctx.fillText(subtitle, x + 98, y + 46);
        ctx.fillStyle = faint;
        ctx.font = '400 12px Lexend, sans-serif';
        ctx.fillText(meta, x + 98, y + 70);
      }

      function chip(ctx, x, y, label, active) {
        ctx.font = '500 14px Lexend, sans-serif';
        const w = ctx.measureText(label).width + 28;
        roundPath(ctx, x, y, w, 34, 17);
        ctx.fillStyle = active ? accent : paper;
        ctx.fill();
        ctx.strokeStyle = active ? accent : line;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = active ? '#FFFFFF' : ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x + w / 2, y + 17);
      }

      function drawTabBar(ctx, width, height, active) {
        const y = height - 96;
        const x = 28;
        const w = width - 56;
        const h = 68;
        ctx.save();
        ctx.shadowColor = 'rgba(16, 19, 16, 0.12)';
        ctx.shadowBlur = 24;
        ctx.shadowOffsetY = 8;
        roundPath(ctx, x, y, w, h, 34);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = line;
        ctx.lineWidth = 1;
        roundPath(ctx, x, y, w, h, 34);
        ctx.stroke();
        const labels = ['Jobs', 'Reports', 'Settings'];
        const slot = w / 3;
        roundPath(ctx, x + 6, y + 6, slot - 8, h - 12, 28);
        ctx.fillStyle = accent;
        ctx.fill();
        labels.forEach((label, index) => {
          const cx = x + slot * index + slot / 2;
          ctx.fillStyle = index === active ? '#FFFFFF' : faint;
          ctx.font = '500 12px Lexend, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, cx, y + 44);
          ctx.strokeStyle = index === active ? '#FFFFFF' : faint;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          if (index === 0) {
            roundPath(ctx, cx - 9, y + 16, 18, 14, 3);
            ctx.stroke();
          } else if (index === 1) {
            ctx.strokeRect(cx - 8, y + 16, 16, 18);
          } else {
            ctx.arc(cx, y + 24, 8, 0, Math.PI * 2);
            ctx.stroke();
          }
        });
      }

      function wrapLeft(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let cursor = y;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        words.forEach((word, index) => {
          const next = line ? `${line} ${word}` : word;
          if (ctx.measureText(next).width > maxWidth && line) {
            ctx.fillText(line, x, cursor);
            line = word;
            cursor += lineHeight;
          } else {
            line = next;
          }
          if (index === words.length - 1) ctx.fillText(line, x, cursor);
        });
      }

      function roundPath(ctx, x, y, width, height, radius) {
        const r = Math.min(radius, width / 2, height / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + width, y, x + width, y + height, r);
        ctx.arcTo(x + width, y + height, x, y + height, r);
        ctx.arcTo(x, y + height, x, y, r);
        ctx.arcTo(x, y, x + width, y, r);
        ctx.closePath();
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error(`Could not load ${src}`));
          image.src = src;
        });
      }
    </script>
  </body>
</html>
